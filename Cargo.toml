[workspace]
members = [
    "crates/juzo-core",
    "crates/juzo",
]
resolver = "3"

[patch.crates-io]
juzo-core = { path = "crates/juzo-core" }

[workspace.package]
edition = "2024"
publish = false

[profile.dev]
debug = 0

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
tokio = { version = "1.52.1", features = ["full"] }
telers = { git = "https://github.com/Desiders/telers", rev = "ce87e5497ba207841024030d6db72a0ea1b57a42", default-features = false, features = ["default-tls", "serde"]}

# БД.
sea-orm = { version = "2.0.0", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-rust_decimal",
    "with-chrono",
] }

# Математика.
rust_decimal = "1.42.1"

# Время.
chrono = { version = "0.4.45", features = ["serde"] }

